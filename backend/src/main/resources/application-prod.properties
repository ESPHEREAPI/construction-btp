# Production profile - activate with SPRING_PROFILES_ACTIVE=prod.
# No secrets here: DB_PASSWORD, JWT_SECRET and LICENSE_SECRET must be provided
# as real environment variables in the deployment target (no local fallback
# for this profile - the app fails fast at boot if they're missing).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

logging.level.root=WARN
logging.level.com.construction=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

springdoc.swagger-ui.enabled=false
