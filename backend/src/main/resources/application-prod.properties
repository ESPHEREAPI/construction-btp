# Production profile - activate with SPRING_PROFILES_ACTIVE=prod.
# No secrets here: DB_PASSWORD, JWT_SECRET and LICENSE_SECRET must be provided
# as real environment variables in the deployment target (no local fallback
# for this profile - the app fails fast at boot if they're missing).
# "validate" by default (safe: never auto-modifies the prod schema). For the
# very first deploy against an empty database, set DDL_AUTO=update in .env
# for one run so Hibernate creates the initial tables, then remove it (or set
# it back to "validate") for every deploy after that.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=false

logging.level.root=WARN
logging.level.com.construction=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

springdoc.swagger-ui.enabled=false
