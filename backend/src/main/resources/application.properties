# ========================================
# APPLICATION CONFIGURATION
# ========================================
spring.application.name=Construction Material Management System
server.port=${SERVER_PORT:8080}

# Local dev loads application-local.properties automatically (see that file).
# In CI/production, set SPRING_PROFILES_ACTIVE explicitly (e.g. prod) and
# provide the required secrets below as real environment variables.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# ========================================
# DATABASE CONFIGURATION (MySQL)
# ========================================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:construction_material_db}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&sessionVariables=default_storage_engine=InnoDB
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ========================================
# INTERNATIONALIZATION (i18n)
# ========================================
spring.messages.basename=i18n/messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=true
spring.messages.cache-duration=3600

# ========================================
# JWT CONFIGURATION
# ========================================
# No default: the app must fail fast at boot rather than run with a made-up secret.
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# License activation key signing - deliberately a DIFFERENT secret from jwt.secret
# (a leaked license key must never let someone forge a user session JWT, or vice versa)
app.license.secret=${LICENSE_SECRET}

# ========================================
# SECURITY CONFIGURATION
# ========================================
security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
security.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
security.cors.allowed-headers=*
security.cors.allow-credentials=true

# ========================================
# SWAGGER / OPENAPI CONFIGURATION
# ========================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.operations-sorter=method

# ========================================
# LOGGING CONFIGURATION
# ========================================
logging.level.root=INFO
logging.level.com.construction=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ========================================
# FILE UPLOAD CONFIGURATION
# ========================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ========================================
# ACTUATOR CONFIGURATION
# ========================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# ========================================
# APPLICATION CUSTOM PROPERTIES
# ========================================
app.alert.threshold.percentage=90
app.default.locale=fr

# No default: this repo is public, a hardcoded initial password would let
# anyone race the real admin's first login on a fresh deployment.
app.superadmin.initial-password=${SUPERADMIN_INITIAL_PASSWORD}
