<div class="container">
  <div class="row justify-content-center w-100">
    <div class="col-12 col-sm-10 col-md-8 col-lg-7 col-xl-6">

      <div class="text-center mb-4">
        <h2 class="logo">{{ 'app.title' | translate }}</h2>
      </div>

      <div class="card">
        <div class="card-body">
          <div class="text-center mb-4">
            <h5 class="card-title">{{ 'register.createCompany' | translate }}</h5>
            <p class="text-muted small">{{ 'register.freeTrial' | translate }}</p>
          </div>

          <form (ngSubmit)="onSubmit()">
            <div class="mb-4">
              <label for="companyName" class="form-label">{{ 'register.companyName' | translate }}</label>
              <div class="input-group">
                <input type="text" class="form-control" id="companyName"
                  [(ngModel)]="request.companyName" name="companyName" required>
                <span class="input-group-text"><i class="bi bi-building"></i></span>
              </div>
            </div>

            <div class="row">
              <div class="col-6 mb-4">
                <label for="firstName" class="form-label">{{ 'register.firstName' | translate }}</label>
                <div class="input-group">
                  <input type="text" class="form-control" id="firstName"
                    [(ngModel)]="request.firstName" name="firstName">
                </div>
              </div>
              <div class="col-6 mb-4">
                <label for="lastName" class="form-label">{{ 'register.lastName' | translate }}</label>
                <div class="input-group">
                  <input type="text" class="form-control" id="lastName"
                    [(ngModel)]="request.lastName" name="lastName">
                </div>
              </div>
            </div>

            <div class="mb-4">
              <label for="username" class="form-label">{{ 'register.username' | translate }}</label>
              <div class="input-group">
                <input type="text" class="form-control" id="username"
                  [(ngModel)]="request.username" name="username" required>
                <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
              </div>
            </div>

            <div class="mb-4">
              <label for="email" class="form-label">{{ 'register.email' | translate }}</label>
              <div class="input-group">
                <input type="email" class="form-control" id="email"
                  [(ngModel)]="request.email" name="email" required>
                <span class="input-group-text"><i class="bi bi-envelope-fill"></i></span>
              </div>
            </div>

            <div class="mb-4">
              <label for="password" class="form-label">{{ 'register.password' | translate }}</label>
              <div class="input-group">
                <input type="password" class="form-control" id="password"
                  [(ngModel)]="request.password" name="password" required minlength="6">
                <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
              </div>
            </div>

            <div class="mb-4">
              <label for="confirmPassword" class="form-label">{{ 'register.confirmPassword' | translate }}</label>
              <div class="input-group">
                <input type="password" class="form-control" id="confirmPassword"
                  [(ngModel)]="confirmPassword" name="confirmPassword" required>
                <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
              </div>
            </div>

            <div class="mb-4" *ngIf="error">
              <div class="alert alert-danger mb-0">
                <i class="bi bi-exclamation-circle-fill me-2"></i>{{ error }}
              </div>
            </div>

            <div class="mb-4" *ngIf="success">
              <div class="alert alert-success mb-0">
                <i class="bi bi-check-circle-fill me-2"></i>{{ success }}
              </div>
            </div>

            <div class="d-grid mb-3">
              <button class="btn btn-primary btn-lg" type="submit" [disabled]="loading">
                <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
                {{ 'register.submit' | translate }}
              </button>
            </div>
          </form>

          <div class="text-center mt-2">
            <a routerLink="/login">{{ 'register.alreadyHaveAccount' | translate }}</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
