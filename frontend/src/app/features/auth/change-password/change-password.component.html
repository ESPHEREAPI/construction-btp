<div class="container">
  <div class="row justify-content-center w-100">
    <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5">

      <div class="text-center mb-4">
        <h2 class="logo">{{ 'app.title' | translate }}</h2>
      </div>

      <div class="card">
        <div class="card-body">
          <div class="text-center mb-4">
            <h5 class="card-title">Changer votre mot de passe</h5>
            <p class="text-muted small" *ngIf="forced">
              Pour des raisons de sécurité, vous devez définir un nouveau mot de passe avant de continuer.
            </p>
          </div>

          <form (ngSubmit)="onSubmit()">
            <div class="mb-4">
              <label for="currentPassword" class="form-label">Mot de passe actuel</label>
              <div class="input-group">
                <input type="password" class="form-control" id="currentPassword"
                  [(ngModel)]="request.currentPassword" name="currentPassword" required>
                <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
              </div>
            </div>

            <div class="mb-4">
              <label for="newPassword" class="form-label">Nouveau mot de passe</label>
              <div class="input-group">
                <input type="password" class="form-control" id="newPassword"
                  [(ngModel)]="request.newPassword" name="newPassword" required minlength="6">
                <span class="input-group-text"><i class="bi bi-shield-lock-fill"></i></span>
              </div>
            </div>

            <div class="mb-4">
              <label for="confirmPassword" class="form-label">Confirmer le nouveau mot de passe</label>
              <div class="input-group">
                <input type="password" class="form-control" id="confirmPassword"
                  [(ngModel)]="confirmPassword" name="confirmPassword" required>
                <span class="input-group-text"><i class="bi bi-shield-lock-fill"></i></span>
              </div>
            </div>

            <div class="mb-4" *ngIf="error">
              <div class="alert alert-danger mb-0">
                <i class="bi bi-exclamation-circle-fill me-2"></i>{{ error }}
              </div>
            </div>

            <div class="d-grid mb-3">
              <button class="btn btn-primary btn-lg" type="submit" [disabled]="loading">
                <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
                Changer le mot de passe
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
