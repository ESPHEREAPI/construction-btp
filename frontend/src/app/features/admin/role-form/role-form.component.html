<div class="container-fluid">
  <div class="row">
    <div class="col-12">
      <div class="card">
        <div class="card-header">
          <h5 class="mb-0">
            <i class="bi bi-shield me-2"></i>
            {{ isEditMode ? 'Modifier le rôle' : 'Nouveau rôle' }}
          </h5>
        </div>

        <div class="card-body">
          <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

          <form (ngSubmit)="onSubmit()" #roleForm="ngForm">
            <div class="row">
              <div class="col-md-4 mb-3">
                <label class="form-label">Nom (FR) *</label>
                <input type="text" class="form-control" [(ngModel)]="role.nameFr"
                       name="nameFr" required>
              </div>

              <div class="col-md-4 mb-3">
                <label class="form-label">Name (EN)</label>
                <input type="text" class="form-control" [(ngModel)]="role.nameEn"
                       name="nameEn" placeholder="Repli sur le FR si vide">
              </div>

              <div class="col-md-4 mb-3">
                <label class="form-label">Nome (PT)</label>
                <input type="text" class="form-control" [(ngModel)]="role.namePt"
                       name="namePt" placeholder="Repli sur le FR si vide">
              </div>

              <div class="col-12 mb-3">
                <label class="form-label d-block">Permissions</label>
                <div class="permission-group mb-3" *ngFor="let group of permissionGroups">
                  <div class="fw-bold text-muted small text-uppercase mb-1">{{ 'permissionCategories.' + group.category | translate }}</div>
                  <div class="form-check form-check-inline" *ngFor="let permission of group.permissions">
                    <input type="checkbox" class="form-check-input" [id]="'perm-' + permission.id"
                      [checked]="role.permissionIds.includes(permission.id)" (change)="togglePermission(permission.id)">
                    <label class="form-check-label" [for]="'perm-' + permission.id">{{ 'permissions.' + permission.name | translate }}</label>
                  </div>
                </div>
              </div>
            </div>

            <div class="d-flex justify-content-end gap-2">
              <button type="button" class="btn btn-secondary" (click)="onCancel()">
                Annuler
              </button>
              <button type="submit" class="btn btn-primary" [disabled]="!roleForm.valid || loading">
                <span *ngIf="loading" class="spinner-border spinner-border-sm me-1"></span>
                {{ isEditMode ? 'Modifier' : 'Créer' }}
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
