<app-header (toggleSidebar)="onToggleSidebar()"></app-header>
<app-sidebar [collapsed]="sidebarCollapsed"></app-sidebar>

<main id="main" class="main" [class.main-collapsed]="sidebarCollapsed">
  <div class="alert alert-warning d-flex align-items-center" role="alert" *ngIf="licenseStatusService.blocked$ | async as code">
    <i class="bi bi-exclamation-triangle-fill me-2"></i>
    <span [ngSwitch]="code">
      <span *ngSwitchCase="'LICENSE_SUSPENDED'">{{ 'licenseBanner.suspended' | translate }}</span>
      <span *ngSwitchCase="'LICENSE_REQUIRED'">{{ 'licenseBanner.required' | translate }}</span>
      <span *ngSwitchCase="'LICENSE_MODULE_NOT_ACTIVE'">{{ 'licenseBanner.moduleNotActive' | translate }}</span>
      <span *ngSwitchDefault>{{ 'licenseBanner.expired' | translate }}</span>
    </span>
  </div>
  <router-outlet></router-outlet>
</main>
