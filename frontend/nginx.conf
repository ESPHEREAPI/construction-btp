server {
    listen 80;
    server_name _;

    # Convenience redirect from the bare root.
    location = / {
        return 302 /construction-btp/;
    }

    # Angular app + client-side routing, served under a subpath so this
    # server can host other apps at the domain root or other prefixes later.
    location /construction-btp/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /construction-btp/index.html;
    }

    # Same-origin API, kept at the root (never called directly by the
    # browser as a raw URL, only via environment.prod.ts's apiUrl) - no CORS
    # to configure.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
}
