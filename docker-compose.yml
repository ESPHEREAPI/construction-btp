services:
  backend:
    build:
      context: ./backend
    env_file:
      - .env
    # Lets the container reach the host's native MySQL (127.0.0.1:3306 on
    # the host) without publishing anything - works on Linux Docker 20.10+.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - construction-btp-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "8082:80"
    depends_on:
      - backend
    networks:
      - construction-btp-network
    restart: unless-stopped

  # One phpMyAdmin, both MySQL instances: PMA_HOSTS/PMA_PORTS (plural) make
  # it show a server-picker dropdown at login instead of connecting to a
  # single fixed server. Server 1 = native MySQL (construction_material_db,
  # login with construction_btp / DB_PASSWORD from deploy/mysql-bootstrap.sql).
  # Server 2 = the dockerized easycom-mysql (reachable via its host-published
  # port 3307, same as the existing easycom-phpmyadmin uses) - login with
  # whatever credentials that stack already uses.
  phpmyadmin:
    image: phpmyadmin:latest
    environment:
      PMA_HOSTS: host.docker.internal,host.docker.internal
      PMA_PORTS: 3306,3307
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8083:80"
    networks:
      - construction-btp-network
    restart: unless-stopped

networks:
  construction-btp-network:
    driver: bridge
